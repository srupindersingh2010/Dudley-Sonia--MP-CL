name: Probe URLs (maintenance)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated URLs to test'
        required: true
      grep:
        description: 'Optional regex: print only matching lines/links instead of the first 2500 chars'
        required: false
        default: ''
      browser:
        description: 'Render with headless Chromium first (yes/no)'
        required: false
        default: 'no'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q requests playwright
          if [ "$BROWSER" = "yes" ]; then python -m playwright install --with-deps chromium >/dev/null; fi
          python - <<'PY'
          import os, re, requests
          for u in os.environ["URLS"].split():
              if os.environ.get("BROWSER") == "yes":
                  from playwright.sync_api import sync_playwright
                  with sync_playwright() as p:
                      b = p.chromium.launch(); pg = b.new_page(); pg.goto(u, wait_until="networkidle", timeout=60000)
                      html = pg.content(); b.close()
                  class R: pass
                  r = R(); r.status_code = "rendered"; r.url = u; r.text = html
              try:
                  if os.environ.get("BROWSER") != "yes":
                      r = requests.get(u, timeout=30, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"})
                  print("=====", u, r.status_code, r.url, len(r.text)); g = os.environ.get("GREP")
                  if g:
                      for m in sorted(set(re.findall(r'href="([^"]*)"', r.text))):
                          if re.search(g, m, re.I): print("  LINK", m)
                      for m in re.findall(r'[^{}\n]{0,160}(?:' + g + r')[^{}\n]{0,160}', r.text, re.I)[:40]: print("  TXT", m.strip())
                  else:
                      print(r.text[:2500])
              except Exception as e:
                  print("=====", u, "ERROR", e)
          PY
        env:
          URLS: ${{ inputs.urls }}
          GREP: ${{ inputs.grep }}
          BROWSER: ${{ inputs.browser }}
